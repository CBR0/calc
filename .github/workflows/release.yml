name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Collect release files
        # Only the artifacts people download, without the per-arch files that
        # share a name (calc.png, icon.png, the raw binary): two of them in
        # one release would collide, as GitHub asset names are unique.
        run: |
          mkdir -p release
          for dir in build/*/; do
            for f in "$dir"*.tar.gz "$dir"*.deb "$dir"*.exe; do
              [ -e "$f" ] || continue
              cp "$f" release/
            done
          done
          # One install.sh is enough: the same in every Linux build.
          if [ -f build/linux-amd64/install.sh ]; then
            cp build/linux-amd64/install.sh release/
          fi
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
